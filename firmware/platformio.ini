; RiseQuest firmware (CS147 Group 8)
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_eol = LF
monitor_filters = send_on_enter, esp32_exception_decoder
monitor_echo = yes
; Don't let the monitor hold EN/IO0 when it (re)connects, which leaves the
; board stuck in "waiting for download" instead of running the firmware.
monitor_dtr = 0
monitor_rts = 0
; Two app slots so signed over-the-air updates can be installed.
board_build.partitions = min_spiffs.csv
build_flags =
    -Wall
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    bblanchon/ArduinoJson@^7.2.1
